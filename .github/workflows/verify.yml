name: Verify

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]

# Run only the newest commit's checks for each branch. PR checks always run;
# documentation-only pushes do not spend browser/CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - run: npm install
      - run: node --test tests/catalog-parser.test.mjs tests/review-only-stage.test.mjs tests/catalog-import-contract.test.mjs tests/pwa-contract.test.mjs tests/pwa-runtime.test.mjs
      - uses: denoland/setup-deno@v2
      - run: deno check --no-check=remote supabase/functions/ibass-catalog-stage/index.ts
      - run: deno check --no-check=remote supabase/functions/catalog-import/index.ts
      - run: npm run typecheck
      - name: Build and report bundle module attribution
        env:
          ANALYZE_BUNDLE: '1'
        run: npm run build
      - name: Prepare modern Node for TypeScript-only frontend unit tests
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run pure frontend progress and scheduling unit tests
        run: node --experimental-strip-types --test tests/progress-summary.test.mjs tests/study-schedule.test.mjs

  utme-subject-choice-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Test UTME subject-choice migration in disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/utme_subject_choice.test.sql
      - name: Test syllabus publication visibility policies in disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/syllabus_publication_visibility.test.sql
