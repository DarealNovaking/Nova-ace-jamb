name: Verify

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]

# Run only the newest commit's checks for each branch. PR checks always run;
# documentation-only pushes do not spend browser/CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node --test tests/catalog-parser.test.mjs tests/review-only-stage.test.mjs tests/catalog-import-contract.test.mjs tests/pwa-contract.test.mjs tests/pwa-runtime.test.mjs
      - uses: denoland/setup-deno@v2
      - run: deno check --no-check=remote supabase/functions/ibass-catalog-stage/index.ts
      - run: deno check --no-check=remote supabase/functions/catalog-import/index.ts
      - run: npm run typecheck
      - name: Build and report bundle module attribution
        env:
          ANALYZE_BUNDLE: '1'
        run: npm run build
      - name: Prepare modern Node for TypeScript-only frontend unit tests
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run pure frontend progress and scheduling unit tests
        run: node --experimental-strip-types --test tests/progress-summary.test.mjs tests/study-schedule.test.mjs

  utme-subject-choice-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Test UTME subject-choice migration in disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/utme_subject_choice.test.sql
      - name: Test syllabus publication visibility policies in disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/syllabus_publication_visibility.test.sql
      - name: Test FCB-01 RPC owner and approval boundaries
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/fcb_01_rpc_security.test.sql
      - name: Test competing administrator demotions in native PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: postgres
        run: python3 tests/sql/fcb_01_role_concurrency.py
      - name: Test FCB-01 syllabus authoring authorization
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/fcb_01_syllabus_authorization.test.sql
      - name: Test FCB-01 question rights and attempt bounds
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/fcb_01_question_rights.test.sql
      - name: Test proposed owner-scoped answer-key-free question delivery
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/sql/fcb_01_attempt_delivery.test.sql

  recovered-schema-baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify deterministic baseline rendering
        run: |
          python3 scripts/render-ace-schema-baseline.py
          git diff --exit-code -- supabase/schema/ace-2026-10-27.sql
      - name: Replay recovered schema and test real auth trigger
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/fcb_01_schema_baseline.test.sql
      - name: Verify every recovered catalog definition and API privilege
        run: python3 tests/sql/fcb_01_schema_parity.py
      - name: Verify recovery refuses an existing schema
        run: |
          if psql -X -v ON_ERROR_STOP=1 -f supabase/schema/ace-2026-10-27.sql > /tmp/ace-replay-refusal.log 2>&1; then
            echo 'Recovery unexpectedly accepted existing schema'
            exit 1
          fi
          grep -F 'schema "ace" already exists' /tmp/ace-replay-refusal.log
          python3 tests/sql/fcb_01_schema_parity.py
      - name: Test proposed secure CBT mutations against the full schema
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/fcb_01_cbt_mutations.test.sql
      - name: Test proposed signup referral collision guard
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/fcb_01_signup_referral_collision.test.sql
      - name: Test native CBT submit replay and save races
        run: python3 tests/sql/fcb_01_cbt_concurrency.py
